# Production-oriented Compose file (no source bind-mounts).
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spectora-app:latest
    container_name: spectora-app
    restart: unless-stopped
    ports:
      - "8000:8080"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - spectora-storage:/var/www/html/storage
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/storage/database.sqlite
    networks:
      - default
      - proxy_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/ops"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  spectora-storage:

networks:
  default:
  proxy_default:
    external: true
