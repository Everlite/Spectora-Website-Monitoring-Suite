name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        run: composer test

      - name: Run Laravel Pint (audit-touched paths)
        run: |
          vendor/bin/pint --test \
            app/Services/DomainAlertService.php \
            app/Notifications/DomainWarningNotification.php \
            app/Policies/UserPolicy.php \
            app/Models/DomainNote.php \
            app/Http/Controllers/DomainNoteController.php \
            app/Http/Controllers/UserController.php \
            app/Jobs/CheckUrlJob.php \
            database/migrations/2026_05_30_120000_align_domain_notes_schema.php \
            database/migrations/2025_11_27_232432_create_helper_tables.php \
            database/migrations/2025_11_28_190653_create_domain_notes_table.php \
            routes/auth.php \
            routes/web.php \
            tests/Feature/DomainNoteTest.php \
            tests/Feature/CheckUrlJobTest.php \
            tests/Unit/ReportServicePdfTest.php \
            tests/Unit/SecurityServiceTest.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build
